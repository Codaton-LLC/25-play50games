# Netlify build settings. The Next.js app lives in play50games-frontend, not at the repo root:
# without this file Netlify publishes the repo root as plain files and "/" answers "Page not found".
# The Next.js runtime is named below: this project was linked before it had a base directory, so
# Netlify did not add the runtime by itself and served the .next folder as plain files.
#
# Environment variables are NOT set here: add them in the Netlify UI
# (Project configuration > Environment variables): NEXT_PUBLIC_ARCADE_ENABLED,
# NEXT_PUBLIC_ARCADE_LEADERBOARD, NEXT_PUBLIC_ARCADE_LEVELS, NEXT_PUBLIC_SITE_URL and
# NEXT_PUBLIC_WORDPRESS_API_URL. Never the preview-only flags (CLAUDE.md "Feature flags").
# Netlify is the live address since 2026-11-18 (CLAUDE.md "Deploy").

[build]
  base = "play50games-frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # more heap for next build (see next.config.js: one static-generation worker)
  NODE_OPTIONS = "--max-old-space-size=4096"

[[plugins]]
  package = "@netlify/plugin-nextjs"
