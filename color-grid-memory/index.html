<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Color Grid Memory</title>
      <style>
         :root {
            --bg: #0b1220;
            --panel: #0f1b33;
            --text: #e8eefc;
            --muted: #a6b3d1;
            --accent: #6ea8ff;
            --good: #36d399;
            --bad: #fb7185;
            --radius: 18px;
         }
         * {
            box-sizing: border-box;
         }
         body {
            margin: 0;
            font-family: system-ui;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
         }
         .app {
            width: min(980px, 100%);
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 18px;
         }
         @media (max-width: 900px) {
            .app {
               grid-template-columns: 1fr;
            }
         }
         .panel {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 18px;
         }
         header {
            display: flex;
            justify-content: space-between;
            align-items: center;
         }
         button {
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            font-weight: 700;
            cursor: pointer;
         }
         .primary {
            background: var(--accent);
            color: #081126;
         }
         .grid {
            display: grid;
            grid-template-columns: repeat(4, 60px);
            gap: 12px;
            justify-content: center;
            margin-top: 20px;
         }
         .cell {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: #15254a;
            cursor: pointer;
            transition: 0.15s;
         }
         .cell.highlight {
            background: var(--accent);
         }
         .cell.c1 {
            background: #6ea8ff;
         }
         .cell.c2 {
            background: #36d399;
         }
         .cell.c3 {
            background: #fbbf24;
         }
         .cell.c4 {
            background: #fb7185;
         }
         .cell.correct {
            background: var(--good);
         }
         .cell.wrong {
            background: var(--bad);
         }
         .side {
            padding: 18px;
         }
      </style>
   </head>
   <body>
      <div class="app">
         <section class="panel">
            <header>
               <h1>Color Grid Memory</h1>
               <button class="primary" id="newBtn">New</button>
            </header>
            <p>Watch which cells are highlighted. Repeat the pattern.</p>
            <div class="grid" id="grid"></div>
         </section>
         <aside class="panel side">
            <h3>How to Play</h3>
            <ul>
               <li>Memorize highlighted cells</li>
               <li>Click same cells after they disappear</li>
            </ul>
            <h3>Tips</h3>
            <ul>
               <li>Remember shapes</li>
               <li>Group cells visually</li>
            </ul>
         </aside>
      </div>
      <script>
         const grid = document.getElementById("grid");
         const newBtn = document.getElementById("newBtn");
         let pattern = [],
            input = [],
            size = 4;
         function render() {
            grid.innerHTML = "";
            for (let i = 0; i < size * size; i++) {
               const c = document.createElement("div");
               c.className = "cell";
               c.dataset.i = i;
               c.onclick = () => clickCell(c, i);
               grid.appendChild(c);
            }
         }
         function showPattern() {
            const colors = ["c1", "c2", "c3", "c4"];
            pattern = [...Array(size * size).keys()]
               .sort(() => 0.5 - Math.random())
               .slice(0, 4)
               .map((i) => ({
                  idx: i,
                  color: colors[Math.floor(Math.random() * colors.length)],
               }));

            pattern.forEach((p, step) => {
               setTimeout(() => {
                  const cell = grid.children[p.idx];
                  cell.classList.add(p.color, "highlight");
               }, 500 * step);
            });

            setTimeout(() => {
               pattern.forEach((p) => {
                  const cell = grid.children[p.idx];
                  cell.classList.remove("highlight", "c1", "c2", "c3", "c4");
               });
            }, 2500);
         }
         function clickCell(c, i) {
            input.push(i);
            const hit = pattern.find((p) => p.idx === i);
            if (!hit) {
               c.classList.add("wrong");
            } else {
               c.classList.add(hit.color);
            }
         }
         newBtn.onclick = () => {
            input = [];
            render();
            showPattern();
         };
         render();
         showPattern();
      </script>
   </body>
</html>
