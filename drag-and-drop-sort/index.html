<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Drag and Drop Sort – Preview</title>
      <style>
         body {
            margin: 0;
            font-family: system-ui;
            background: #0b1220;
            color: #e8eefc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
         }
         .box {
            width: 900px;
            max-width: 95%;
            background: #111c35;
            border-radius: 18px;
            padding: 20px;
         }
         h1 {
            margin: 0 0 10px;
         }
         .zones {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
         }
         .zone {
            flex: 1;
            border: 2px dashed #6ea8ff;
            border-radius: 14px;
            padding: 12px;
            min-height: 120px;
         }
         .zone h3 {
            margin: 0 0 6px;
            font-size: 14px;
         }
         .items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
         }
         .item {
            padding: 10px 14px;
            background: #1c2b55;
            border-radius: 999px;
            cursor: grab;
            font-weight: 700;
         }
      </style>
   </head>
   <body>
      <div class="box">
         <h1>Drag & Drop Sort – Preview</h1>
         <div class="zones">
            <div class="zone" data-cat="fruit"><h3>🍎 Fruits</h3></div>
            <div class="zone" data-cat="animal"><h3>🐾 Animals</h3></div>
         </div>
         <div class="items" id="items"></div>
      </div>

      <script>
         const itemsData = [
            { name: "Apple", cat: "fruit" },
            { name: "Banana", cat: "fruit" },
            { name: "Dog", cat: "animal" },
            { name: "Cat", cat: "animal" },
         ];
         const itemsEl = document.getElementById("items");

         itemsData.forEach((it, i) => {
            const el = document.createElement("div");
            el.className = "item";
            el.textContent = it.name;
            el.draggable = true;
            el.id = "i" + i;
            el.dataset.cat = it.cat;
            el.addEventListener("dragstart", (e) => {
               e.dataTransfer.setData("text/plain", el.id);
            });
            itemsEl.appendChild(el);
         });

         document.querySelectorAll(".zone").forEach((zone) => {
            zone.addEventListener("dragover", (e) => e.preventDefault());
            zone.addEventListener("drop", (e) => {
               e.preventDefault();
               const id = e.dataTransfer.getData("text/plain");
               const item = document.getElementById(id);
               if (item.dataset.cat === zone.dataset.cat) {
                  zone.appendChild(item);
                  item.style.background = "#36d399";
               } else {
                  item.style.background = "#fb7185";
               }
            });
         });
      </script>
   </body>
</html>
